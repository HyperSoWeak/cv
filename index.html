<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4f4f5;
      }
      .frame {
        border: 0;
        width: 100%;
        height: 100%;
      }
      .fallback {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1;
        background: #111827;
        color: #fff;
        text-decoration: none;
        padding: 8px 12px;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <a class="fallback" href="./resume.pdf">Open PDF</a>
    <iframe class="frame" src="./resume.pdf" title="Resume PDF"></iframe>
  </body>
</html>
