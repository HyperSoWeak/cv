name: Build and Deploy Resume

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Install Font Awesome 6 fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip fontconfig
          curl -L -o /tmp/fontawesome-desktop.zip \
            https://github.com/FortAwesome/Font-Awesome/releases/download/6.7.2/fontawesome-free-6.7.2-desktop.zip
          mkdir -p ~/.local/share/fonts/fontawesome6
          unzip -j /tmp/fontawesome-desktop.zip "fontawesome-free-6.7.2-desktop/otfs/*.otf" -d ~/.local/share/fonts/fontawesome6
          fc-cache -f

      - name: Compile resume.pdf
        run: typst compile resume.typ resume.pdf

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp resume.pdf dist/resume.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
